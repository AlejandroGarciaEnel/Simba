<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMBA · Sesiones inactivas</title>
    <style type="text/tailwindcss">
        @import "tailwindcss";
    </style>
    <script src="vendor/tailwind.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 antialiased"
      style="background-image: radial-gradient(1000px 500px at 10% -10%, rgba(99,102,241,.18), transparent)">
    <main class="mx-auto max-w-[1600px] p-6">
        <header class="mb-6 flex flex-wrap items-center gap-4">
            <a href="/" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 ring-1 ring-white/10 transition hover:bg-white/5">← Volver a SIMBA</a>
            <div>
                <h1 class="text-2xl font-semibold text-white">Sesiones inactivas &gt; 30 min</h1>
                <p id="meta" class="text-sm text-slate-400">Cargando…</p>
            </div>
            <div class="ml-auto flex items-center gap-2">
                <span id="live" class="hidden items-center gap-2 rounded-full bg-emerald-500/10 px-3 py-1 text-xs font-medium text-emerald-300 ring-1 ring-emerald-400/30">
                    <span class="h-2 w-2 animate-pulse rounded-full bg-emerald-400"></span>en vivo
                </span>
                <button id="reload" class="rounded-lg bg-white/5 px-3 py-2 text-sm ring-1 ring-white/10 transition hover:bg-white/10">↻ Actualizar</button>
                <button id="csv" class="rounded-lg bg-indigo-500 px-3 py-2 text-sm font-medium text-white shadow transition hover:bg-indigo-400">⬇ CSV</button>
            </div>
        </header>

        <section id="stats" class="mb-5 grid grid-cols-2 gap-4 lg:grid-cols-4"></section>

        <section class="rounded-2xl bg-slate-900/80 p-4 ring-1 ring-white/10 shadow-xl">
            <div class="mb-3 flex flex-wrap items-center gap-3">
                <input id="q" type="search" placeholder="Filtrar por usuario, máquina, programa, módulo…"
                       class="min-w-[280px] flex-1 rounded-lg bg-slate-800 px-3 py-2 text-sm text-slate-100 ring-1 ring-white/10 outline-none placeholder:text-slate-500 focus:ring-indigo-400">
                <select id="inst" class="rounded-lg bg-slate-800 px-3 py-2 text-sm ring-1 ring-white/10">
                    <option value="">Todos los nodos</option>
                </select>
                <select id="min" class="rounded-lg bg-slate-800 px-3 py-2 text-sm ring-1 ring-white/10">
                    <option value="0">Cualquier antigüedad</option>
                    <option value="3600">&gt; 1 h</option>
                    <option value="14400">&gt; 4 h</option>
                    <option value="86400">&gt; 1 día</option>
                </select>
            </div>
            <div id="chips" class="mb-3 flex flex-wrap gap-2"></div>
            <div class="overflow-auto rounded-xl ring-1 ring-white/10" style="max-height:65vh">
                <table class="w-full text-left text-sm">
                    <thead id="thead" class="sticky top-0 bg-slate-800 text-xs uppercase tracking-wide text-slate-400"></thead>
                    <tbody id="tbody" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
            <div class="mt-3 flex items-center justify-between text-sm text-slate-400">
                <span id="count"></span>
                <span class="flex items-center gap-2">
                    <button id="prev" class="rounded-lg bg-white/5 px-3 py-1.5 ring-1 ring-white/10 hover:bg-white/10 disabled:opacity-40">‹</button>
                    <span id="page"></span>
                    <button id="next" class="rounded-lg bg-white/5 px-3 py-1.5 ring-1 ring-white/10 hover:bg-white/10 disabled:opacity-40">›</button>
                </span>
            </div>
        </section>
        <p id="msg" class="mt-6 text-center text-sm text-rose-300"></p>
    </main>
    <script src="inactivas.js"></script>
</body>
</html>
